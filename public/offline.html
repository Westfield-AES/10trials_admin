<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#032e4d" />
    <title>Offline | 10Trials Administration</title>
    <style>
      :root { color-scheme: light; font-family: "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #f3f6f8; color: #102231; }
      main { width: min(100%, 480px); border: 1px solid #dce5eb; border-radius: 10px; background: white; padding: 32px; box-shadow: 0 3px 14px rgba(3, 46, 77, 0.05); }
      .brand { display: inline-flex; align-items: center; gap: 12px; }
      .mark { width: 2px; height: 36px; background: #e85b00; }
      .name { color: #032e4d; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
      .label { color: #607282; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 { margin: 32px 0 0; color: #032e4d; font-size: 30px; letter-spacing: -0.04em; }
      p { margin: 12px 0 0; color: #607282; font-size: 15px; line-height: 1.6; }
      a { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; margin-top: 24px; border-radius: 6px; padding: 9px 16px; background: #e85b00; color: white; font-size: 14px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid #e85b00; outline-offset: 3px; }
      @media (max-width: 420px) { main { padding: 24px; } h1 { font-size: 27px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="10Trials Administration">
        <span class="mark" aria-hidden="true"></span>
        <span><span class="name">10Trials</span><br /><span class="label">Admin console</span></span>
      </div>
      <h1>You’re offline</h1>
      <p>
        Administration data is not stored for offline use. Reconnect to the internet, then try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
